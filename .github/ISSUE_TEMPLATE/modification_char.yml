name: "Character Modification"
description: "Request modifying an existing character in the GI Loadouts roster"
title: "Add additional description in character `{name}`"
labels:
  - "enhancement"
  - "good first issue"
body:
  - type: "input"
    id: "name"
    attributes:
      label: "Name"
      description: "Name of the character page on the Genshin Impact wiki"
      placeholder: "e.g. Traveler"
    validations:
      required: true
  - type: "input"
    id: "release"
    attributes:
      label: "Release"
      description: "Game release version after which the modification is needed"
      placeholder: "e.g. 7.0"
    validations:
      required: true
  - type: "input"
    id: "wiki"
    attributes:
      label: "Page"
      description: "Link to the character page on the Genshin Impact wiki"
      placeholder: "e.g. https://genshin-impact.fandom.com/wiki/Traveler"
    validations:
      required: true